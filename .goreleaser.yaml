# Builds release binaries for every merge to main (see .github/workflows/release.yml).
# Local dry run: goreleaser release --snapshot --clean
version: 2
project_name: baker

builds:
  - id: baker
    main: ./cmd/baker
    binary: baker
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/knightlybuilds-tech/baker/internal/cli.Version=v{{ .Version }}

archives:
  - id: baker
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"

release:
  github:
    owner: knightlybuilds-tech
    name: baker
  prerelease: auto
  footer: |
    Install: download the archive for your OS, unpack it, and put `baker` on your PATH.
    Or: `go install github.com/knightlybuilds-tech/baker/cmd/baker@{{ .Tag }}`
